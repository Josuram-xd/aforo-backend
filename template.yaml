AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aforo-backend - API del piloto de aforo (API Gateway HTTP API + Lambda)

Parameters:
  AmplifyOrigin:
    Type: String
    Default: "https://amplify-pendiente.invalid"
    Description: >-
      Origen del dashboard en AWS Amplify permitido por CORS (por ejemplo
      https://main.d1234abcd.amplifyapp.com, sin barra final). El valor por defecto es un
      marcador que no coincide con ningun sitio real.

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    CodeUri: src/
    MemorySize: 128
    Timeout: 10
    # Table lives in the aforo-db stack; every function reads its name from TABLE_NAME.
    # Policies are not supported in Globals: each function that touches the table must add
    #   Policies:
    #     - DynamoDBCrudPolicy:
    #         TableName: !ImportValue AforoPilotTableName
    Environment:
      Variables:
        TABLE_NAME: !ImportValue AforoPilotTableName

Resources:
  # Single HTTP API shared by all routes; routes are attached per function (task 2.2 onwards).
  AforoHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The dashboard (Amplify or local dev server) calls the GET routes from the browser.
      CorsConfiguration:
        AllowOrigins:
          - !Ref AmplifyOrigin
          - http://localhost:5173
          - http://localhost:3000
        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.health.handler
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /health
            Method: GET

  PostEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.post_events.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue AforoPilotTableName
      Events:
        PostEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /events
            Method: POST

  GetAforoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_aforo.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue AforoPilotTableName
      Events:
        GetAforo:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /aforo
            Method: GET

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_events.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue AforoPilotTableName
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /events
            Method: GET

  GetPeopleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_people.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue AforoPilotTableName
      Events:
        GetPeople:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /people
            Method: GET

Outputs:
  ApiUrl:
    Description: URL base del API
    Value: !Sub "https://${AforoHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
