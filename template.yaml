AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aforo-backend (Python) - HTTP API + one Lambda over Supabase, for entry/exit control of a course

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL, e.g. https://uezrriyikquncmcgwwzo.supabase.co

  SupabasePublishableKey:
    Type: String
    Description: Supabase publishable (anon) key. Public by design; RLS protects the data.

  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Supabase service-role key. Only POST /invite-user uses it; leave empty to disable that
      route (it answers 503). Never commit it.

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://main.d2o7lrrjmkkq29.amplifyapp.com,http://localhost:5173"
    Description: Frontend origins allowed by CORS (no trailing slash).

  InviteRedirectTo:
    Type: String
    Default: ""
    Description: >-
      Optional fixed URL for the invite e-mail link. Empty means the caller's allowed origin
      plus /auth/callback. Must be listed in Supabase Auth > Redirect URLs.

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    CodeUri: src/
    MemorySize: 256
    Timeout: 25

Resources:
  AforoHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Cost guard: cap requests so nobody can run up the bill. CORS is answered by the Lambda.
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

  AforoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          INVITE_REDIRECT_TO: !Ref InviteRedirectTo
      Events:
        AnyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref AforoHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${AforoHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
